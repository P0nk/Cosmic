# This workflow will build a Java project with Maven.
# Overridden from upstream to run on windows-latest, since this fork's agents develop and deploy on native
# Windows — CI should match the actual target, not upstream's Ubuntu default.

name: Run build
on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'corretto'
    - name: Build with Maven (compile -> test -> package)
      run: .\mvnw.cmd -B package
